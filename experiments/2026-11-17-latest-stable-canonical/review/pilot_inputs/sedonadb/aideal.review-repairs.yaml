comprehension:
  class_context: false
  relevant_doc_chars: 12000
  execute:
    scaffold: runtime/api_test_scaffold.py
    test_filename: ApiTest.py
    region:
    - '# TODO API_TEST_START'
    - '# TODO API_TEST_END'
    build: ''
    command: '"/home/zshan011/apps/aideal/envs/2026-11-16-sedonadb/bin/python" "/home/zshan011/apps/aideal/studies/2026-11-17-latest-stable-canonical/libraries/sedonadb/runtime/run_snippet.py"
      "{test_file}"'
    work_dir: execution
    output_dir: execution/output
    local_uris: false
    sample_data:
      raster_cea_tif: fixtures/cea.tif
      raster_test4_tif: fixtures/test4.tiff
    preamble: ''
    io_hints: ''
    max_fix_rounds: 0
    require_correctness: true
    timeout_seconds: 60
    success_marker: __DONE__
    error_marker: __RUN_ERR__
    check_marker: __CHECK__
    execution_context: 'Write Python statements only. A SedonaDB connection named
      sd is already provided. The target is a SQL function, not a Python method: call
      it inside sd.sql("SELECT ..."). Materialize with .to_arrow_table(), which returns
      a real pyarrow.Table. Read a scalar with table.column("name")[0].as_py() or
      rows with table.to_pylist(). Setup SQL may use sd.sql(...).execute(). The adapter
      requires the target SQL function to be called and materialized. Do not import
      another database or replace sd. Use Python assert with a falsifiable documented
      expectation and then print the exact target __CHECK__ witness.'
    exec_hints: Use individual SQL statements. Paths raster_cea_tif and raster_test4_tif
      are available local fixture files; output_dir is available for tiny outputs.
      Use only these paths when a documented operation needs a file. Tiny SQL VALUES
      and documented constructors are available for in-memory inputs. Do not use remote
      URLs. This review pilot permits an initial attempt and up to two code-repair attempts; stop immediately when an attempt passes.
