<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="770" viewBox="0 0 1220 770"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#52677b"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="30" y="36" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#23384a">AIDEAL experiment workflow</text>
<text x="30" y="65" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#23384a">The current revision changes API selection before the next paid run.</text>
<rect x="30" y="100" width="320" height="135" rx="12" fill="#edf5fa" stroke="#9bacbb"/>
<text x="48" y="130" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#23384a">1  Pin inputs</text>
<text x="48" y="158" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">Library version, source, original docs</text>
<text x="48" y="183" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">Runtime, fixtures, model settings</text>
<rect x="450" y="100" width="320" height="135" rx="12" fill="#edf5fa" stroke="#9bacbb"/>
<text x="468" y="130" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#23384a">2  Inventory source</text>
<text x="468" y="158" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">Keep every declaration and owner</text>
<text x="468" y="183" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">Separate production and test support</text>
<rect x="870" y="100" width="320" height="135" rx="12" fill="#fff1d9" stroke="#9bacbb"/>
<text x="888" y="130" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#23384a">3  Select canonical APIs</text>
<text x="888" y="158" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">Exclude forwarding wrappers</text>
<text x="888" y="183" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">One name → maximum parameters</text>
<rect x="870" y="320" width="320" height="135" rx="12" fill="#edf5fa" stroke="#9bacbb"/>
<text x="888" y="350" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#23384a">4  Audit original docs</text>
<text x="888" y="378" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">Evidence found D; not found U</text>
<text x="888" y="403" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">Keep both groups in the bank</text>
<rect x="450" y="320" width="320" height="135" rx="12" fill="#edf5fa" stroke="#9bacbb"/>
<text x="468" y="350" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#23384a">5  Freeze comparison</text>
<text x="468" y="378" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">Same selected APIs across conditions</text>
<text x="468" y="403" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">Exact identities and separate outputs</text>
<rect x="30" y="320" width="320" height="135" rx="12" fill="#edf5fa" stroke="#9bacbb"/>
<text x="48" y="350" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#23384a">6  Original R0</text>
<text x="48" y="378" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">Write one program per selected API</text>
<text x="48" y="403" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">Save prompt, code, output and usage</text>
<rect x="30" y="540" width="320" height="135" rx="12" fill="#f0edf8" stroke="#9bacbb"/>
<text x="48" y="570" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#23384a">7  Develop resources</text>
<text x="48" y="598" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">README · aliases · embedded hints</text>
<text x="48" y="623" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">Validate before branch installation</text>
<rect x="450" y="540" width="320" height="135" rx="12" fill="#f0edf8" stroke="#9bacbb"/>
<text x="468" y="570" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#23384a">8  Matched evaluation</text>
<text x="468" y="598" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">Micro and puzzles; R0 → R1 → R2</text>
<text x="468" y="623" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">Deep dive → fresh README evaluation</text>
<rect x="870" y="540" width="320" height="135" rx="12" fill="#edf5fa" stroke="#9bacbb"/>
<text x="888" y="570" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#23384a">9  Report evidence</text>
<text x="888" y="598" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">Full set and documented/uncovered</text>
<text x="888" y="623" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">Accuracy · fixes · errors · time · tokens</text>
