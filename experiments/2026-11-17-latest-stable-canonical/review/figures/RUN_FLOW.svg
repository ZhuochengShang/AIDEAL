<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1130" viewBox="0 0 1440 1130" role="img" aria-labelledby="title desc">
<title id="title">AIDEAL Original R0 and README authoring workflow</title>
<desc id="desc">Frozen API and documentation inputs enter an isolated queue. One branch generates and executes Original R0 programs. The other distills documentation and generates README entries. Every stage records requests, outputs and identities. R0 has one trial and zero repairs. README completion does not establish execution validation.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#687e90"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#163247}.title{font-size:32px;font-weight:700}.sub{font-size:18px;fill:#50697c}.head{font-size:23px;font-weight:700}.body{font-size:19px}.small{font-size:16px;fill:#4f687b}.code{font-family:Menlo,Consolas,monospace;font-size:14px;fill:#365366}.label{font-size:15px;font-weight:700;fill:#45657b}.arrow{fill:none;stroke:#687e90;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1440" height="1130" fill="white"/>
<text x="64" y="52" class="title">AIDEAL · Original R0 and README generation</text>
<text x="64" y="84" class="sub">Six libraries · seven execution banks · 5,307 selected API identities · two independent jobs per bank</text>
<rect x="64" y="110" width="1312" height="128" rx="12" fill="#f3f6fa" stroke="#b8c7d4" stroke-width="1.5"/>
<text x="88" y="146" class="head">1  Freeze the inputs</text>
<text x="88" y="181" class="body">Selected API identities + pinned source + original documents + project profile + fixtures + execution setup</text>
<text x="88" y="213" class="code">review/qualified-api/  ·  review/qualified-plan/  ·  STUDY_LOCK.json  ·  file checksums</text>
<path d="M720 238 V271" class="arrow"/>
<rect x="64" y="276" width="1312" height="95" rx="12" fill="#f5f2fb" stroke="#c5badc" stroke-width="1.5"/>
<text x="88" y="312" class="head">2  Dispatch isolated jobs</text>
<text x="88" y="345" class="body">At most two jobs run concurrently. Each job owns its output folder and uses the pinned evaluator release.</text>
<path d="M720 371 V399 H374 V428" class="arrow"/>
<path d="M720 399 H1066 V428" class="arrow"/>
<rect x="64" y="433" width="620" height="148" rx="12" fill="#edf5fc" stroke="#8db5d5" stroke-width="1.5"/>
<text x="88" y="471" class="head">3A  Audience writes the R0 program</text>
<text x="88" y="507" class="body">Original README + exact excerpt + API/setup inputs</text>
<text x="88" y="536" class="small">One initial program. No prior failures and no repairs.</text>
<text x="88" y="565" class="code">prompt: comprehension_write_exec.md</text>
<path d="M374 581 V616" class="arrow"/>
<rect x="64" y="621" width="620" height="126" rx="12" fill="#edf5fc" stroke="#8db5d5" stroke-width="1.5"/>
<text x="88" y="658" class="head">4A  Build, run and check</text>
<text x="88" y="694" class="body">Insert code into the scaffold; execute; record outcome.</text>
<text x="88" y="725" class="code">doc_check_execution._comprehension_execute</text>
<path d="M374 747 V782" class="arrow"/>
<rect x="64" y="787" width="620" height="148" rx="12" fill="#edf5fc" stroke="#8db5d5" stroke-width="1.5"/>
<text x="88" y="825" class="head">5A  Save per-API evidence and results</text>
<text x="88" y="859" class="body">Request · response · program · stdout/stderr · verdict</text>
<text x="88" y="889" class="small">Tokens · time · error category · checkpoint</text>
<text x="88" y="918" class="code">qualified/runs/original/&lt;bank&gt;/&lt;bank&gt;/</text>
<rect x="756" y="433" width="620" height="148" rx="12" fill="#edf7f1" stroke="#8fbaa0" stroke-width="1.5"/>
<text x="780" y="471" class="head">3B  Distill the original document corpus</text>
<text x="780" y="507" class="body">Send all reviewed text in recorded chunks.</text>
<text x="780" y="536" class="small">Save compact notes, chunk boundaries and hashes.</text>
<text x="780" y="565" class="code">prompt: readme_distill.md</text>
<path d="M1066 581 V616" class="arrow"/>
<rect x="756" y="621" width="620" height="126" rx="12" fill="#edf7f1" stroke="#8fbaa0" stroke-width="1.5"/>
<text x="780" y="658" class="head">4B  Author each selected API entry</text>
<text x="780" y="694" class="body">API facts + comments + exact excerpts + notes</text>
<text x="780" y="725" class="code">prompt: readme_entry.md  ·  no live probes</text>
<path d="M1066 747 V782" class="arrow"/>
<rect x="756" y="787" width="620" height="148" rx="12" fill="#edf7f1" stroke="#8fbaa0" stroke-width="1.5"/>
<text x="780" y="825" class="head">5B  Save entries and completion evidence</text>
<text x="780" y="859" class="body">Request · response · usage · pending/final README</text>
<text x="780" y="889" class="small">Status: authored, not execution validated</text>
<text x="780" y="918" class="code">qualified/authoring/&lt;bank&gt;/&lt;bank&gt;/</text>
<path d="M374 935 V960 H720 V979" class="arrow"/>
<path d="M1066 935 V960 H720" class="arrow"/>
<rect x="64" y="984" width="1312" height="78" rx="12" fill="#fff8e9" stroke="#d8c396" stroke-width="1.5"/>
<text x="88" y="1016" class="head">6  Inspect progress and resume only matching inputs</text>
<text x="88" y="1046" class="small">supervisor/summary.json + per-job state + immutable attempt records; changed inputs require a new output identity.</text>
<text x="64" y="1100" class="small">Native R0 uses audience-written assertions. README authoring does not execute examples or install a source treatment.</text>
</svg>
