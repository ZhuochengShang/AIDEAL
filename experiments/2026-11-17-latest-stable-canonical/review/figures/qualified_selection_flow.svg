<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc"><title id="title">Selection preserves defining identity</title><desc id="desc">Candidate declarations and exposure paths are resolved before within-owner overload selection. Review remains necessary.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#71879a"/></marker></defs><rect width="1200" height="530" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#18344b}.title{font-size:27px;font-weight:700}.label{font-size:20px;font-weight:700}.body{font-size:17px}.note{font-size:16px;fill:#526779}</style><text class="title" x="38" y="48">Selection preserves defining identity</text><path d="M384 146 L420 146" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M772 146 L808 146" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M987 209 L987 248 L211 248 L211 282" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M384 352 L420 352" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M772 352 L808 352" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="38" y="83" width="346" height="126" rx="11" fill="#edf5fb" stroke="#c3d3e0"/><text class="label" x="56" y="115">1 · Pinned source</text><text class="body" x="56" y="145">Six official source versions</text><text class="body" x="56" y="169">Entire Beast repository by module</text><rect x="426" y="83" width="346" height="126" rx="11" fill="#edf5fb" stroke="#c3d3e0"/><text class="label" x="444" y="115">2 · Full candidate ledger</text><text class="body" x="444" y="145">Declarations + public exposure paths</text><text class="body" x="444" y="169">Unknowns and exclusions stay visible</text><rect x="814" y="83" width="346" height="126" rx="11" fill="#edf5fb" stroke="#c3d3e0"/><text class="label" x="832" y="115">3 · Resolve identity</text><text class="body" x="832" y="145">Defining owner and library origin</text><text class="body" x="832" y="169">Public aliases refer to the same API</text><rect x="38" y="289" width="346" height="126" rx="11" fill="#f4f7fa" stroke="#c3d3e0"/><text class="label" x="56" y="321">4 · Review wrappers</text><text class="body" x="56" y="351">Require forwarding evidence</text><text class="body" x="56" y="375">Map removal to a retained target</text><rect x="426" y="289" width="346" height="126" rx="11" fill="#f4f7fa" stroke="#c3d3e0"/><text class="label" x="444" y="321">5 · Compare overloads</text><text class="body" x="444" y="351">Largest arity within one owner/API</text><text class="body" x="444" y="375">Unknown competing arity holds election</text><rect x="814" y="289" width="346" height="126" rx="11" fill="#fff2d8" stroke="#c3d3e0"/><text class="label" x="832" y="321">6 · Freeze reviewed inputs</text><text class="body" x="832" y="351">Selected IDs + sites + doc dispositions</text><text class="body" x="832" y="375">Exact hashes and review decision</text><text class="note" x="38" y="463">An unknown body is not proof of redundancy. Public exposure paths are not additional target APIs.</text><text class="note" x="38" y="491">Recorded structural rules do not establish universal semantic uniqueness or identify every possible wrapper.</text></svg>