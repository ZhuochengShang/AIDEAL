<title id="title">Six stable libraries and five isolated conditions</title>
<desc id="desc">A shared pinned evaluator and one original baseline per library feed five condition refs. Thirty public refs preserve exact upstream trees. The same 1695 selected target identities are prepared with unique outputs. Treatments are not installed. No paid run has started; user review is required.</desc>
