<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="440" viewBox="0 0 1220 440"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#52677b"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="30" y="38" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#23384a">Program repair rounds and README revision</text>
<rect x="30" y="80" width="320" height="120" rx="12" fill="#edf5fa" stroke="#9bacbb"/>
<text x="48" y="110" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#23384a">R0 · Initial program</text>
<text x="48" y="138" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">Task + fixed resources</text>
<text x="48" y="163" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">Compile, run and check</text>
<rect x="450" y="80" width="320" height="120" rx="12" fill="#edf5fa" stroke="#9bacbb"/>
<text x="468" y="110" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#23384a">R1 · First repair</text>
<text x="468" y="138" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">Failed program + diagnostic</text>
<text x="468" y="163" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">Compile, run and check</text>
<rect x="870" y="80" width="320" height="120" rx="12" fill="#edf5fa" stroke="#9bacbb"/>
<text x="888" y="110" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#23384a">R2 · Second repair</text>
<text x="888" y="138" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">Latest permitted failure context</text>
<text x="888" y="163" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">Compile, run and check</text>
<path d="M350 140 L445 140" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M770 140 L865 140" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="360" y="125" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#23384a">if failed</text>
<text x="780" y="125" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#23384a">if failed</text>
<text x="30" y="237" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#23384a">Stop on the first pass. R0-only experiments do not make the R1/R2 calls.</text>
<rect x="30" y="277" width="520" height="110" rx="12" fill="#f0edf8" stroke="#9bacbb"/>
<text x="48" y="307" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#23384a">Separate development step</text>
<text x="48" y="335" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">After the configured repair rounds, diagnose</text>
<text x="48" y="360" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">residual failures and revise selected README entries.</text>
<rect x="670" y="277" width="520" height="110" rx="12" fill="#f0edf8" stroke="#9bacbb"/>
<text x="688" y="307" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#23384a">Fresh evaluation</text>
<text x="688" y="335" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">Freeze the revised README, then restart at R0.</text>
<text x="688" y="360" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#23384a">This is not another program repair round.</text>
<path d="M550 330 L665 330" fill="none" stroke="#52677b" stroke-width="2.2" marker-end="url(#arrow)"/>
</svg>