<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc"><title id="title">Current preparation and later measured stages</title><desc id="desc">Preparation and user review precede six live pilots and full initial authoring/evaluation. Five treatment evaluation and fresh post-deep-dive evaluation are later stages.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#71879a"/></marker></defs><rect width="1200" height="550" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#18344b}.title{font-size:27px;font-weight:700}.label{font-size:20px;font-weight:700}.body{font-size:17px}.note{font-size:16px;fill:#526779}</style><text class="title" x="38" y="48">Current preparation and later measured stages</text><path d="M300 151 L313 151" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M590 151 L603 151" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M880 151 L893 151" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M1035 216 L1035 290 L165 290 L165 334" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M300 403 L313 403" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M590 403 L603 403" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M880 403 L893 403" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="30" y="86" width="270" height="130" rx="11" fill="#edf5fb" stroke="#c3d3e0"/><text class="label" x="48" y="118">Prepared evidence</text><text class="body" x="48" y="148">Inventory, original docs, inputs</text><text class="body" x="48" y="172">Offline checks + review</text><rect x="320" y="86" width="270" height="130" rx="11" fill="#fff2d8" stroke="#c3d3e0"/><text class="label" x="338" y="118">User review gate</text><text class="body" x="338" y="148">Approve the frozen plan</text><text class="body" x="338" y="172">Hold until explicit approval</text><rect x="610" y="86" width="270" height="130" rx="11" fill="#f4f7fa" stroke="#c3d3e0"/><text class="label" x="628" y="118">Six live pilots</text><text class="body" x="628" y="148">One API per library</text><text class="body" x="628" y="172">Programs + complete outputs</text><rect x="900" y="86" width="270" height="130" rx="11" fill="#f4f7fa" stroke="#c3d3e0"/><text class="label" x="918" y="118">Full initial work</text><text class="body" x="918" y="148">Complete README authoring</text><text class="body" x="918" y="172">Original micro at R0</text><rect x="30" y="341" width="270" height="125" rx="11" fill="#f4f7fa" stroke="#c3d3e0"/><text class="label" x="48" y="373">Freeze five treatments</text><text class="body" x="48" y="403">Original / README / Alias</text><text class="body" x="48" y="427">Error hints / Combined</text><rect x="320" y="341" width="270" height="125" rx="11" fill="#f4f7fa" stroke="#c3d3e0"/><text class="label" x="338" y="373">Matched evaluation</text><text class="body" x="338" y="403">Same bank, fixtures and oracle</text><text class="body" x="338" y="427">R0 → failed R1 → failed R2</text><rect x="610" y="341" width="270" height="125" rx="11" fill="#f4f7fa" stroke="#c3d3e0"/><text class="label" x="628" y="373">Later deep dive</text><text class="body" x="628" y="403">README / Combined failures</text><text class="body" x="628" y="427">Revise and freeze documents</text><rect x="900" y="341" width="270" height="125" rx="11" fill="#f4f7fa" stroke="#c3d3e0"/><text class="label" x="918" y="373">Fresh evaluation</text><text class="body" x="918" y="403">Fresh audience identity</text><text class="body" x="918" y="427">Keep earlier results unchanged</text><text class="note" x="34" y="263">Gray stages are planned. No new live authoring or evaluation is authorized by this diagram.</text><text class="note" x="34" y="510">Aliases/hints/Combined remain baseline placeholders; puzzles and secondary studies need separate reviewed protocols.</text></svg>