role: an expert molecular-simulation researcher and scientific Python engineer using
  MDAnalysis for reproducible trajectory and structure analysis.
project:
  name: MDAnalysis
  language: Python
  description: MDAnalysis 2.11.0, an object-oriented scientific Python library for
    reading molecular structures and trajectories, selecting atoms, transforming coordinates,
    and running molecular-dynamics analyses.
  version: 2.11.0
domain: Molecular-dynamics trajectory and structural analysis in Python, including
  topology/coordinate I/O, atom selections, geometric measurements, trajectory transformations,
  and reusable analysis algorithms.
target_users:
- computational chemists and molecular-simulation researchers
- scientific Python developers analyzing proteins and materials
use_cases:
- Load a topology and trajectory into a Universe and select atoms.
- Compute structural properties such as centers of mass and radii of gyration.
- Iterate over trajectory frames and analyze changing coordinates.
- Run RMSD, distance, contact, and other MDAnalysis.analysis workflows.
constraints:
- A Universe owns topology and trajectory state.
- AtomGroup methods operate on selected atoms at the current trajectory frame.
- Analysis classes generally require construction followed by run().
- 'Use only the five read-only fixture copies byte-verified against pinned MDAnalysisTests
  2.11.0: PSF, DCD, PDB, GRO, and XTC; never substitute downloaded data.'
- The PSF/DCD pair is preloaded for general trajectory analysis; format-specific APIs
  may use the matching PDB, GRO, or XTC in mdanalysis_fixture_dir. That directory
  contains exactly these five approved fixtures.
- Some readers and converters require optional dependencies; a missing optional package
  is an infrastructure outcome, not evidence that the documentation is wrong.
- The adk_dims.dcd trajectory has no periodic box dimensions; use a checked-in periodic
  fixture when an API requires periodic boundaries.
- Do not download data, invoke a GUI, or write large trajectories.
- Use every name in the frozen 435-name canonical manifest without sampling; selection
  is structural filtering and same-name maximum arity, not a proof of arbitrary semantic
  equivalence.
- Treat the shared fixture directory as read-only. Create any temporary or output
  files only in output_dir. Source-checkout fixture paths are not execution inputs.
