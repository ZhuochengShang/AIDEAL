comprehension:
  execute:
    execution_context: A runnable headless Python test harness is already in scope.
      The snippet is inserted inside a function and the preamble variables listed
      under available inputs are already defined. Write executable statements only.
      Import MDAnalysis submodules or optional dependencies only when the documented
      public call requires them. Do not define another function or process entry point.
      Assert a deterministic property and print a compact correctness witness containing
      a shape, scalar, or length.
    region:
    - '# TODO API_TEST_START'
    - '# TODO API_TEST_END'
    strip_snippet_imports: false
    output_tail_chars: 2000
    success_marker: __DONE__
    error_marker: __RUN_ERR__
    work_dir: execution
    timeout_seconds: 300
    max_fix_rounds: 0
    auto_report: false
    test_filename: api_test.py
    command: env -u PYTHONPATH -u PYTHONHOME MPLBACKEND=Agg OPENBLAS_NUM_THREADS=1
      OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMBA_NUM_THREADS=1 PYTHONHASHSEED=0 /home/zshan011/apps/aideal/envs/2026-11-17-latest-stable/bin/python
      "{test_file}"
    exec_hints: Use the preloaded Universe, AtomGroups, trajectory, and the pinned
      molecular fixture paths. Keep atom selections and frame ranges small. For analysis
      classes construct the documented class, call run() when required, and validate
      a stable scalar, shape, or length. The PSF/DCD pair has no periodic box; use
      a matching configured periodic fixture only when the target contract requires
      it. Write any small output only under output_dir; do not modify source fixtures,
      download data, or open a GUI.
    scaffold: inputs/api_test_scaffold.py
    local_uris: false
    output_dir: execution/output
    preamble: 'MDAnalysis = mda  # type: module

      numpy = np  # type: module

      universe = mda.Universe(psf_path, dcd_path)  # type: MDAnalysis.Universe

      atoms = universe.atoms  # type: MDAnalysis.core.groups.AtomGroup

      protein = universe.select_atoms("protein")  # type: MDAnalysis.core.groups.AtomGroup

      backbone = universe.select_atoms("protein and backbone")  # type: MDAnalysis.core.groups.AtomGroup

      trajectory = universe.trajectory  # type: MDAnalysis.coordinates.base.ReaderBase

      timestep = trajectory[0]  # type: MDAnalysis.coordinates.base.Timestep

      '
    sample_data:
      psf_path: /home/zshan011/apps/aideal/studies/2026-11-17-latest-stable-canonical/libraries/mdanalysis/fixtures/adk.psf
      dcd_path: /home/zshan011/apps/aideal/studies/2026-11-17-latest-stable-canonical/libraries/mdanalysis/fixtures/adk_dims.dcd
      pdb_path: /home/zshan011/apps/aideal/studies/2026-11-17-latest-stable-canonical/libraries/mdanalysis/fixtures/adk_open.pdb
      gro_path: /home/zshan011/apps/aideal/studies/2026-11-17-latest-stable-canonical/libraries/mdanalysis/fixtures/adk_oplsaa.gro
      xtc_path: /home/zshan011/apps/aideal/studies/2026-11-17-latest-stable-canonical/libraries/mdanalysis/fixtures/adk_oplsaa.xtc
      mdanalysis_fixture_dir: /home/zshan011/apps/aideal/studies/2026-11-17-latest-stable-canonical/libraries/mdanalysis/fixtures
