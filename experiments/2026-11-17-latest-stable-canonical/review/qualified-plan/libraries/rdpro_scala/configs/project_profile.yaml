project_name: RDPro / Beast
role: An expert Scala developer using public Beast/RDPro raster, vector and Spark
  APIs.
project:
  name: RDPro
  language: Scala
  description: Pinned official Beast0.10.1 production source
domain: Geospatial computing
target_users:
- Scala geospatial developers
use_cases:
- Raster processing and zonal statistics
- Vector spatial operations and indexed files
- Local Spark transformations
constraints:
- Use original APIs only.
- Use provided local raster, shapefile, and HDF4 fixtures or tiny in-memory values.
- Write temporary outputs only under the run output directory.
- Do not contact services or change repository files.
