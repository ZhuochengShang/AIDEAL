project_name: Thumbnailator
role: An expert in deterministic Java image processing, image I/O, and safe headless
  test harnesses.
project:
  name: Thumbnailator
  language: Java
  description: A small Java image-processing library for producing thumbnails from
    files, streams, URLs, and in-memory images.
  version: 0.4.21
domain: Deterministic Java image processing; selected for this latest-stable study.
target_users:
- Java imaging and media developers
- scientific software users needing deterministic image transformations
- coding agents composing type-safe thumbnail pipelines
use_cases:
- Resize, crop, rotate, watermark, and transform BufferedImages.
- Read and write thumbnails through files and streams.
- Exercise filters, geometry, resizers, naming, and task abstractions.
constraints:
- Use only in-memory images and 95 checked-in test files.
- Run headless and prohibit network, cameras, and desktop UI.
- Compile snippets with JDK 17 javac --release 8; execute headlessly on JDK 17 with
  the official Maven 0.4.21 binary.
- Use the single API identity selected in this request. The frozen manifest defines
  the complete study scope.
