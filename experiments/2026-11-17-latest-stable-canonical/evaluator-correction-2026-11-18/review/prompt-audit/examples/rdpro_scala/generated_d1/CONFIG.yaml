comprehension:
  execute:
    execution_context: 'Scala2.12 with Spark3.5.1 and Java17. The full historical
      scaffold provides sc and sparkContext. The explicit preamble binds rasterRDD:
      RasterRDD[Array[Float]] (11Float32bands,737x628pixels) and featuresRDD: RDD[IFeature]
      (2polygonfeatures). Use the supplied local fixtures or tiny in-memory values.
      Assertions must precede the __CHECK__ witness. HDF4 fixture layer is LST_Day_1km.
      Temporary writes belong in output_dir.'
    region:
    - // TODO API_TEST_START
    - // TODO API_TEST_END
    strip_snippet_imports: false
    output_tail_chars: 2000
    success_marker: __DONE__
    error_marker: __RUN_ERR__
    work_dir: execution
    timeout_seconds: 600
    max_fix_rounds: 0
    auto_report: false
    exec_hints: "Spark specifics: transformations are lazy, so if the result is an\
      \ RDD / RasterRDD / DataFrame you MUST force it with an action \u2014 .count(),\
      \ .first(), or .take(1) \u2014 and print that. For an in-memory Array/value,\
      \ print its size. If the API is a writer, call .coalesce(1) before writing to\
      \ output_dir to avoid the distributed-write merge error. I/O: read inputs with\
      \ the high-level library readers on the pre-loaded typed vars (rasterRDD / featuresRDD,\
      \ or sc.geoTiff / sc.shapefile) \u2014 do NOT open raw Hadoop FileSystem streams\
      \ (FileSystem.get(conf) causes 'Wrong FS'; if unavoidable use path.getFileSystem(sc.hadoopConfiguration)),\
      \ and never prepend an extra 'file://' to a path that already has a scheme."
    fixtures_dir: /home/zshan011/apps/aideal/studies/2026-11-17-latest-stable-canonical/rdpro/inputs/fixtures
    output_dir: execution/output
    command: /home/zshan011/apps/aideal/venv/bin/python /home/zshan011/apps/aideal/studies/2026-11-17-latest-stable-canonical/rdpro/scripts/run_spark_scala.py
      --java /home/zshan011/apps/aideal/runtimes/jdk17/bin/java --classpath-file /home/zshan011/apps/aideal/studies/2026-11-17-latest-stable-canonical/review_snapshot/review/qualified-plan/runtime/rdpro-classpath.json
      --work "{work}" --scala-file "{scala_file}"
